name: "WireGuard Custom"
version: "1.0.6"
slug: wireguard_custom
description: "WireGuard VPN Client"
url: "https://github.com/tstelmaszyk/home_assistant_runwg"
arch:
  - aarch64
  - amd64

# Mode réseau HOST obligatoire
host_network: true

# Permissions (NET_ADMIN suffit : le module wireguard est fourni par le noyau HA OS)
privileged:
  - NET_ADMIN

# Pas d'init système
init: false

# Options
options:
  interface:
    private_key: ""
    address: "10.0.0.2/24,fd00::/64"
  peer:
    public_key: ""
    preshared_key: ""
    endpoint: "vpn.example.com:51820"
    allowed_ips: "0.0.0.0/0, ::0/0"
    # IP du serveur dans le tunnel (ex. 10.0.0.1), pingée au démarrage.
    # Vide : pas de ping, seul le handshake est vérifié.
    check_ip: ""

schema:
  interface:
    private_key: password
    address: str
  peer:
    public_key: str
    preshared_key: password?
    endpoint: str
    allowed_ips: str
    check_ip: str?

# Logging
startup: application
boot: auto